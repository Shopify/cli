query ListAccessibleShops($first: Int!, $filters: [ShopFilterInput!]) {
  organization {
    id
    name
    accessibleShops(first: $first, sort: SHOP_CREATED_AT_DESC, filters: $filters) {
      edges {
        node {
          id
          shopifyShopId
          name
          storeType
          primaryDomain
          url
          createdAt
        }
      }
      pageInfo {
        hasNextPage
      }
    }
  }
}
