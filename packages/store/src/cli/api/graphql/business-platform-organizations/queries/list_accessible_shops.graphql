query ListAccessibleShops($first: Int!, $filters: [ShopFilterInput!], $search: String) {
  organization {
    id
    name
    accessibleShops(first: $first, sort: SHOP_CREATED_AT_DESC, filters: $filters, search: $search) {
      edges {
        node {
          id
          shopifyShopId
          name
          storeType
          primaryDomain
          url
          createdAt
        }
      }
      pageInfo {
        hasNextPage
      }
    }
  }
}
