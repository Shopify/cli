query AppVersions($clientId: String!) {
  app: appByKey(key: $clientId) {
    id
    activeRelease {
      id
      version {
        id
      }
    }
    versions(first: 20) {
      edges {
        node {
          id
          createdAt
          createdBy
          metadata {
            message
              versionTag
          }
        }
      }
    }
    versionsCount
  }
}
