mutation ReleaseVersion($clientId: String!, $versionId: ID!) {
  appReleaseCreate(clientId: $clientId, versionId: $versionId) {
    release {
      version {
        id
        metadata {
          message
          versionTag
        }
      }
    }
    userErrors {
      field
      message
      category
      code
      on
    }
  }
}
