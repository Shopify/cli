mutation CreateAppVersion($clientId: String!, $version: AppVersionInput!, $metadata: VersionMetadataInput) {
  appVersionCreate(clientId: $clientId, version: $version, metadata: $metadata) {
    version {
      id
      appModules {
        ...ReleasedAppModule
      }
      metadata {
        versionTag
        message
      }
    }
    userErrors {
      field
      message
      category
      code
      on
    }
  }
}
