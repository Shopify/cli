mutation DevSessionUpdate(
  $appId: String!
  $assetsUrl: String
  $manifest: JSON
  $inheritedModuleUids: [String!]!
  $unsafeValidation: Boolean
) {
  devSessionUpdate(
    appId: $appId
    assetsUrl: $assetsUrl
    manifest: $manifest
    inheritedModuleUids: $inheritedModuleUids
    isUnsafe: $unsafeValidation
  ) {
    devSession {
      websocketUrl
      updatedAt
      user {
        id
        email
      }
      app {
        id
        key
      }
    }
    warnings {
      message
      code
    }
    userErrors {
      message
      on
      field
      category
    }
  }
}
