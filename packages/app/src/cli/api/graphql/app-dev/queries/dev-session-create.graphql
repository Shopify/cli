mutation DevSessionCreate($appId: String!, $assetsUrl: String!, $websocketUrl: String, $unsafe: Boolean) {
  devSessionCreate(appId: $appId, assetsUrl: $assetsUrl, websocketUrl: $websocketUrl, unsafe: $unsafe) {
    devSession {
      websocketUrl
      updatedAt
      user {
        id
        email
      }
      app {
        id
        key
      }
    }
    warnings {
      message
      code
    }
    userErrors {
      message
      on
      field
      category
    }
  }
}
