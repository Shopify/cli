mutation DevSessionCreate($clientId: String!, $assetsUrl: String!, $websocketUrl: String, $unsafeValidation: Boolean) {
  devSessionCreate(clientId: $clientId, assetsUrl: $assetsUrl, websocketUrl: $websocketUrl, isUnsafe: $unsafeValidation) {
    devSession {
      websocketUrl
      updatedAt
      user {
        id
        email
      }
      app {
        id
        key
      }
    }
    warnings {
      message
      code
    }
    userErrors {
      message
      on
      field
      category
    }
  }
}
