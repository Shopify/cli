query HistoricalLogs(
  $clientId: String!
  $types: [LogType!]!
  $timestamp: TimestampRangeInput!
  $limit: Int!
  $filters: [LogFilterInput!]
  $sortKey: LogSortKeys
  $reverse: Boolean
) {
  app(clientId: $clientId) {
    logs(types: $types, timestamp: $timestamp, limit: $limit, filters: $filters, sortKey: $sortKey, reverse: $reverse) {
      records {
        json
      }
    }
  }
}
