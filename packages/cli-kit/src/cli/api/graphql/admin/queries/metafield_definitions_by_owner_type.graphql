query metafieldDefinitionsByOwnerType($ownerType: MetafieldOwnerType!, $after: String) {
  metafieldDefinitions(ownerType: $ownerType, first: 250, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      key
      name
      namespace
      description
      type {
        category
        name
      }
    }
  }
}
