name: Publish CLI snapshot to Cloudsmith

on:
  workflow_call:
    inputs:
      version:
        description: Version of the CLI snapshot artifact
        required: true
        type: string
      service-slug:
        description: Cloudsmith service account allowed to publish CLI snapshots
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download CLI snapshot
        uses: actions/download-artifact@v4
        with:
          name: cli-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-snapshot
      - name: Validate CLI snapshot
        id: package
        shell: bash
        env:
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/cli-snapshot
          SNAPSHOT_VERSION: ${{ inputs.version }}
          CLOUDSMITH_SERVICE_SLUG: ${{ inputs.service-slug }}
        run: |
          set -euo pipefail
          : "${CLOUDSMITH_SERVICE_SLUG:?Set the CLOUDSMITH_SERVICE_SLUG repository variable}"
          if [[ ! "$SNAPSHOT_VERSION" =~ ^0\.0\.0-snapshot-[0-9]{14}$ ]]; then
            echo "Invalid CLI snapshot version" >&2
            exit 1
          fi
          PACKAGE_FILE="$SNAPSHOT_DIRECTORY/shopify-cli-$SNAPSHOT_VERSION.tgz"
          shopt -s nullglob dotglob
          FILES=("$SNAPSHOT_DIRECTORY"/*)
          if [[ ${#FILES[@]} -ne 1 || ! -f "$PACKAGE_FILE" || -L "$PACKAGE_FILE" ]]; then
            echo "Expected exactly one CLI snapshot tarball" >&2
            exit 1
          fi
          tar -xOf "$PACKAGE_FILE" package/package.json | \
            jq --exit-status --arg version "$SNAPSHOT_VERSION" \
              '.name == "@shopify/cli" and .version == $version' > /dev/null
          echo "path=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
      # Cloudsmith trusts this reusable workflow's job_workflow_ref, not the PR build job.
      - name: Authenticate to Cloudsmith with OIDC
        uses: cloudsmith-io/cloudsmith-cli-action@159f1619275d5d3147f059c3cc110938ec221d16 # v2
        with:
          oidc-namespace: shopify
          oidc-service-slug: ${{ inputs.service-slug }}
          oidc-audience: https://github.com/Shopify
          cli-version: '1.8.0'
          pip-install: 'true'
      - name: Publish CLI snapshot
        shell: bash
        env:
          SNAPSHOT_PACKAGE: ${{ steps.package.outputs.path }}
        run: cloudsmith push npm shopify/node "$SNAPSHOT_PACKAGE" --npm-dist-tag snapshot
