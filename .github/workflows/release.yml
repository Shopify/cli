name: Release

on:
  # Publishes the versions a push brings: on main, World's Version Packages commit, which the public
  # mirror publishes here; on stable/*, a merged "Version Packages - stable/X.Y" pull request.
  push:
    branches:
      - main
      - stable/*

  # Trigger for nightly releases
  schedule:
    - cron: '0 6 * * *' # 6:00 AM UTC every day

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        default: 'nightly'
        type: choice
        options:
          - nightly
          - experimental

concurrency:
  group: changeset-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.11.1'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Opens or updates a stable line's Version Packages pull request. main's versions come from World
  # through the public mirror, so main gets no Version Packages pull request here.
  version-packages:
    name: Version Packages
    if: github.event_name == 'push' && startsWith(github.ref_name, 'stable/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v6
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.12.0
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm changeset-manifests
          title: Version Packages - ${{ github.ref_name }}
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decides, without an npm credential, whether a push has anything to publish, so a push that
  # doesn't change a version never waits for the npm-release approval. Every public package counts,
  # so a partly failed publish is retried.
  check:
    name: Check for unpublished versions
    needs: version-packages
    # Like changesets/action before it, a stable line doesn't publish while changesets are pending.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.version-packages.result != 'failure' && needs.version-packages.outputs.has-changesets != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.npm.outputs.unpublished }}
      version: ${{ steps.npm.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Compare package versions with npm
        id: npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          # `shopify` is published from a copy of packages/cli (bin/create-cli-duplicate-package.js).
          PACKAGES="shopify@$VERSION"
          for MANIFEST in packages/*/package.json; do
            PACKAGES="$PACKAGES $(node -p "const p = require('./$MANIFEST'); p.private ? '' : p.name + '@' + p.version")"
          done
          UNPUBLISHED=false
          for PACKAGE in $PACKAGES; do
            # An npm error counts as unpublished: the publish job then asks for approval, and
            # `changeset publish` skips every version npm already has.
            if [ "$(npm view "$PACKAGE" version 2>/dev/null || true)" = "${PACKAGE##*@}" ]; then
              echo "$PACKAGE is on npm"
            else
              echo "$PACKAGE is not on npm"
              UNPUBLISHED=true
            fi
          done
          echo "Version $VERSION, unpublished $UNPUBLISHED"
          {
            echo "version=$VERSION"
            echo "unpublished=$UNPUBLISHED"
          } >> "$GITHUB_OUTPUT"

  # The only job that publishes a release. The npm-release environment limits it to main and
  # stable/* and asks Dev Experience to approve each run.
  publish:
    name: Publish to npm
    needs: check
    # check's own skipped dependency (version-packages, on main) would skip this job under the
    # implicit success(), so the condition names check's result instead.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.unpublished == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-release
    # Approved runs on one branch publish one at a time, in order; none is cancelled.
    concurrency:
      group: npm-publish-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.12.0

      # After the approval, which can take hours, so a release that published meanwhile counts.
      - name: Choose the dist-tag
        id: dist-tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # A stable line's patch that is older than npm's `latest` goes under stable-X.Y, so it
          # doesn't move `latest` backwards. main always publishes under `latest`.
          DIST_TAG=latest
          if [ "$GITHUB_REF_NAME" != main ]; then
            LATEST=$(npm view @shopify/cli dist-tags.latest)
            if ! node -e '
              const [version, latest] = process.argv.slice(1).map((v) => v.split(".").map(Number))
              const difference = version.map((part, i) => part - latest[i]).find((d) => d !== 0) ?? 0
              process.exit(difference >= 0 ? 0 : 1)
            ' "$VERSION" "$LATEST"; then
              DIST_TAG="stable-${VERSION%.*}"
            fi
          fi
          echo "Publishing $VERSION under $DIST_TAG"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish packages
        run: pnpm release "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.dist-tag }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}

      - name: Create tag
        env:
          TAG: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag $TAG"

      - name: Create stable branch
        id: stable-branch
        if: github.ref_name == 'main' && endsWith(needs.check.outputs.version, '.0')
        # Only Dev Experience members can create stable/* branches, so this push can be refused.
        # The release goes on, and the next step asks Dev Experience to create the branch.
        continue-on-error: true
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          MINOR=${VERSION%.0}
          BRANCH="stable/$MINOR"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Created branch $BRANCH"

      - name: Ask Dev Experience to create the stable branch
        if: steps.stable-branch.outcome == 'failure'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          MINOR=${VERSION%.0}
          MESSAGE="Create stable/$MINOR from tag $VERSION; only Dev Experience can."
          echo "::warning title=stable/$MINOR was not created::$MESSAGE"
          {
            echo "### stable/$MINOR was not created"
            echo
            echo "$MESSAGE"
            echo
            echo '```sh'
            echo "git push origin refs/tags/$VERSION:refs/heads/stable/$MINOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: ${{ !endsWith(needs.check.outputs.version, '.0.0') }}
        env:
          TAG: ${{ needs.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh release create does not support the REST API's make_latest=legacy option.
          RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f make_latest=legacy >/dev/null
            echo "Release $TAG already exists; ensured make_latest=legacy"
            exit 0
          fi
          # The public repository's pull requests are mirror publishes from World, so the notes come
          # from the version's changelog entries rather than from GitHub's generated notes.
          node .github/scripts/release-notes.js "$TAG" > "$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -F body=@"$RUNNER_TEMP/release-notes.md" \
            -f make_latest=legacy >/dev/null
          echo "Created release $TAG"

  # A scheduled nightly of an unchanged main would publish the same code again under a new version.
  nightly-changes:
    name: Check for changes since the last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Compare main with the last successful nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "main hasn't changed since the last successful nightly ($LAST)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Nightly on schedule, nightly or experimental by hand, from main only. A nightly runs in the
  # npm-nightly environment; an experimental release, which is rare, waits for the npm-release approval.
  manual-cron-release:
    name: Manual & Cron Release
    needs: nightly-changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main' && needs.nightly-changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.tag == 'experimental' && 'npm-release' || 'npm-nightly' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.12.0
      - name: Release
        run: pnpm release "$TAG"
        env:
          TAG: ${{ github.event.inputs.tag || 'nightly' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}
