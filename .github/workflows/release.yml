name: Release

on:
  # Publishes the versions a push brings: on main, World's Version Packages commit, which the public
  # mirror publishes here; on stable/*, a merged "Version Packages - stable/X.Y" pull request.
  push:
    branches:
      - main
      - stable/*

  # Trigger for nightly releases
  schedule:
    - cron: '0 6 * * *' # 6:00 AM UTC every day

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        default: 'nightly'
        type: choice
        options:
          - nightly
          - experimental
          # Publishes the current commit's versions on main or stable/*, for a release whose push
          # started no run, or whose run can no longer be re-run.
          - release

concurrency:
  group: changeset-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.11.1'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Opens or updates a stable line's Version Packages pull request. main's versions come from World
  # through the public mirror, so main gets no Version Packages pull request here.
  version-packages:
    name: Version Packages
    if: github.event_name == 'push' && startsWith(github.ref_name, 'stable/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v6
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.22.1
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm changeset-manifests
          title: Version Packages - ${{ github.ref_name }}
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decides, without an npm credential, whether a push has anything to publish. Only versions this
  # push changed count, and the publish job publishes only those. A version that an earlier push
  # brought, which npm still lacks, is finished by re-running that push's run, which builds the same
  # commit, or by the `release` option of a manual run. A later push never publishes it from a
  # newer tree that wasn't released under that version.
  check:
    name: Check for unpublished versions
    needs: version-packages
    # Like changesets/action before it, a stable line doesn't publish while changesets are pending.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.tag == 'release') && needs.version-packages.result != 'failure' && needs.version-packages.outputs.has-changesets != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.npm.outputs.unpublished }}
      version: ${{ steps.npm.outputs.version }}
      packages: ${{ steps.npm.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - name: Compare the pushed versions with npm
        id: npm
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$MANUAL" = true ]; then
            # A manual release counts every version at this commit.
            BEFORE=all
          elif [[ "$BEFORE" =~ ^0*$ ]]; then
            # A push that creates the branch has no earlier commit, so it changes no version.
            BEFORE=none
          else
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          # One "pushed|carried name@version" line per public package. A package counts as pushed
          # when this push changed its version or made it public. `shopify` is published from a
          # copy of packages/cli (bin/create-cli-duplicate-package.js).
          LINES=$(node -e '
            const {execFileSync} = require("node:child_process")
            const fs = require("node:fs")
            const before = process.argv[1]
            const manifestAt = (path) => {
              try {
                return JSON.parse(execFileSync("git", ["show", `${before}:${path}`], {encoding: "utf8", stdio: ["ignore", "pipe", "ignore"]}))
              } catch {
                return undefined
              }
            }
            for (const directory of fs.readdirSync("packages")) {
              const path = `packages/${directory}/package.json`
              if (!fs.existsSync(path)) continue
              const manifest = JSON.parse(fs.readFileSync(path, "utf8"))
              if (manifest.private) continue
              let pushed = before === "all"
              if (before !== "all" && before !== "none") {
                const previous = manifestAt(path)
                pushed = !previous || previous.private === true || previous.version !== manifest.version
              }
              const names = directory === "cli" ? [manifest.name, "shopify"] : [manifest.name]
              for (const name of names) console.log(`${pushed ? "pushed" : "carried"} ${name}@${manifest.version}`)
            }
          ' "$BEFORE")
          UNPUBLISHED=false
          PUSHED=""
          while read -r STATE PACKAGE; do
            [ -n "$PACKAGE" ] || continue
            if [ "$STATE" = pushed ]; then
              PUSHED="$PUSHED ${PACKAGE%@*}"
            fi
            # An npm error counts as unpublished. `changeset publish` skips every version npm
            # already has, so publishing a pushed version that npm does have is harmless.
            if [ "$(npm view "$PACKAGE" version 2>/dev/null || true)" = "${PACKAGE##*@}" ]; then
              echo "$PACKAGE is on npm"
            elif [ "$STATE" = pushed ]; then
              echo "$PACKAGE is not on npm, and this run publishes it"
              UNPUBLISHED=true
            else
              echo "::warning::$PACKAGE is not on npm, but an earlier push brought that version, so this run doesn't publish it. If that push's Release run failed, re-run its failed jobs; if it can't be re-run, start this workflow by hand with the release option."
            fi
          done <<< "$LINES"
          echo "Version $VERSION, unpublished $UNPUBLISHED, packages:$PUSHED"
          {
            echo "version=$VERSION"
            echo "unpublished=$UNPUBLISHED"
            echo "packages=${PUSHED# }"
          } >> "$GITHUB_OUTPUT"

  # The only job that publishes a release. The npm-release environment limits it to main and
  # stable/*.
  publish:
    name: Publish to npm
    needs: check
    # check's own skipped dependency (version-packages, on main) would skip this job under the
    # implicit success(), so the condition names check's result instead.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.unpublished == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-release
    # Approved runs on one branch publish one at a time, in order; none is cancelled.
    concurrency:
      group: npm-publish-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.22.1

      # Read when the job runs, so a release that published meanwhile counts.
      - name: Choose the dist-tag
        id: dist-tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # A stable line's patch that is older than npm's `latest` goes under stable-X.Y, so it
          # doesn't move `latest` backwards. main always publishes under `latest`.
          DIST_TAG=latest
          if [ "$GITHUB_REF_NAME" != main ]; then
            LATEST=$(npm view @shopify/cli dist-tags.latest)
            if ! node -e '
              const [version, latest] = process.argv.slice(1).map((v) => v.split(".").map(Number))
              const difference = version.map((part, i) => part - latest[i]).find((d) => d !== 0) ?? 0
              process.exit(difference >= 0 ? 0 : 1)
            ' "$VERSION" "$LATEST"; then
              DIST_TAG="stable-${VERSION%.*}"
            fi
          fi
          echo "Publishing $VERSION under $DIST_TAG"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # Leaves every other package out of this publish, so a version that an earlier push brought
      # is never published from this commit's tree.
      - name: Publish only the checked packages
        env:
          PACKAGES: ${{ needs.check.outputs.packages }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs")
            const keep = new Set(process.argv[1].split(" ").filter(Boolean))
            for (const directory of fs.readdirSync("packages")) {
              const path = `packages/${directory}/package.json`
              if (!fs.existsSync(path)) continue
              const manifest = JSON.parse(fs.readFileSync(path, "utf8"))
              if (manifest.private || keep.has(manifest.name)) continue
              manifest.private = true
              fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
              console.log(`Not publishing ${manifest.name}@${manifest.version} from this commit`)
            }
          ' "$PACKAGES"

      - name: Publish packages
        run: pnpm release "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.dist-tag }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}

      - name: Create tag
        env:
          TAG: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag $TAG"

      - name: Create stable branch
        id: stable-branch
        if: github.ref_name == 'main' && endsWith(needs.check.outputs.version, '.0')
        # Only Dev Experience members can create stable/* branches, so this push can be refused.
        # The release goes on, and the next step asks Dev Experience to create the branch.
        continue-on-error: true
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          MINOR=${VERSION%.0}
          BRANCH="stable/$MINOR"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Created branch $BRANCH"

      - name: Ask Dev Experience to create the stable branch
        if: steps.stable-branch.outcome == 'failure'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          MINOR=${VERSION%.0}
          MESSAGE="Create stable/$MINOR from tag $VERSION; only Dev Experience can."
          echo "::warning title=stable/$MINOR was not created::$MESSAGE"
          {
            echo "### stable/$MINOR was not created"
            echo
            echo "$MESSAGE"
            echo
            echo '```sh'
            echo "git push origin refs/tags/$VERSION:refs/heads/stable/$MINOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: ${{ !endsWith(needs.check.outputs.version, '.0.0') }}
        env:
          TAG: ${{ needs.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh release create does not support the REST API's make_latest=legacy option.
          RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f make_latest=legacy >/dev/null
            echo "Release $TAG already exists; ensured make_latest=legacy"
            exit 0
          fi
          # The public repository's pull requests are mirror publishes from World, so the notes come
          # from the version's changelog entries rather than from GitHub's generated notes.
          node .github/scripts/release-notes.js "$TAG" > "$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -F body=@"$RUNNER_TEMP/release-notes.md" \
            -f make_latest=legacy >/dev/null
          echo "Created release $TAG"

  # A scheduled nightly of an unchanged main would publish the same code again under a new version.
  nightly-changes:
    name: Check for changes since the last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Compare main with the last successful nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "main hasn't changed since the last successful nightly ($LAST)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Nightly on schedule, nightly or experimental by hand, from main only. A nightly runs in the
  # npm-nightly environment; an experimental release, which is rare, runs in npm-release.
  manual-cron-release:
    name: Manual & Cron Release
    needs: nightly-changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'release')) && github.ref_name == 'main' && needs.nightly-changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.tag == 'experimental' && 'npm-release' || 'npm-nightly' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.22.1
      - name: Release
        run: pnpm release "$TAG"
        env:
          TAG: ${{ github.event.inputs.tag || 'nightly' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}
