name: Release

on:
  # Trigger for snapit functionality
  issue_comment:
    types:
      - created

  # Trigger for changeset release functionality
  push:
    branches:
      - main
      - stable/*

  # Trigger for manual/cron release functionality
  schedule:
    - cron: '0 6 * * *' # 6:00 AM UTC every day

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        default: 'nightly'
        type: choice
        options:
          - nightly
          - latest
          - experimental
          - snapshot
      diagnostics_only:
        description: 'Inspect npm OIDC authentication without publishing'
        default: false
        type: boolean

concurrency:
  group: changeset-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.11.1'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Snapit job - runs when /snapit comment is made on a PR
  snapit:
    name: Snapit
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && (github.event.comment.body == '/snapit' || github.event.comment.body == '/snapit-oidc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # WARNING: DO NOT RUN ANY CUSTOM LOCAL SCRIPT BEFORE RUNNING THE SNAPIT ACTION
      # This action can be executed by 3rd party users and it should not be able to run arbitrary code from a PR.
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.12.0
      - &npm-oidc-diagnostics
        name: Inspect npm OIDC authentication
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const idToken = await core.getIDToken('npm:registry.npmjs.org');
            const [encodedHeader, encodedClaims] = idToken.split('.');
            const header = JSON.parse(Buffer.from(encodedHeader, 'base64url').toString());
            const claims = JSON.parse(Buffer.from(encodedClaims, 'base64url').toString());
            // Log only identity metadata, never the signed token or exchanged credential.
            const claimNames = [
              'iss', 'aud', 'sub', 'repository', 'workflow_ref', 'job_workflow_ref',
              'environment', 'runner_environment', 'event_name',
            ];
            const identity = Object.fromEntries(claimNames.map((name) => [name, claims[name] ?? null]));
            core.info(JSON.stringify({alg: header.alg, kid: header.kid, claims: identity}, null, 2));

            // Test the registry directly to separate identity rejection from publishing tooling.
            const response = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@shopify%2fcli', {
              method: 'POST',
              headers: {Authorization: `Bearer ${idToken}`},
              signal: AbortSignal.timeout(10000),
            });
            core.info(`npm OIDC token exchange: HTTP ${response.status}`);
            for (const name of ['date', 'cf-ray', 'x-npm-request-id', 'x-github-request-id']) {
              const value = response.headers.get(name);
              if (value) core.info(`${name}: ${value}`);
            }
            // The response can contain an npm credential; never read or log its body.
            await response.body?.cancel();
      - name: Force snapshot changeset
        if: ${{ github.event.comment.body == '/snapit' }}
        run: "mv .changeset/force-snapshot-build.md.ignore .changeset/force-snapshot-build.md"
      - name: Create snapshot version
        if: ${{ github.event.comment.body == '/snapit' }}
        uses: Shopify/snapit@2a7ca29133cfeb2c8703654d54bc6dbc565caa69 # registry-and-package-manager
        with:
          comment_is_global: 'true'
          comment_packages: '@shopify/cli'
          comment_suffix: "
            > [!CAUTION]

            > After installing, validate the version by running `shopify version` in your terminal.

            > If the versions don't match, you might have multiple global instances installed.

            > Use `which shopify` to find out which one you are running and uninstall it."
          comment_command_flags: '--@shopify:registry=https://registry.npmjs.org'
          build_script: "node bin/update-cli-kit-version.js && pnpm nx run-many --target=bundle --all --skip-nx-cache --output-style=stream && pnpm refresh-manifests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ''
          NPM_CONFIG_LOGLEVEL: verbose
          NPM_CONFIG_PROVENANCE: true
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}

  # Changeset release job - runs on push to main or stable branches
  changeset-release:
    name: Changeset Release
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.12.0
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm changeset-manifests
          title: Version Packages - ${{ github.ref_name }}
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release latest
        env:
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}

      - name: Get version
        id: version
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag $TAG"

      - name: Create stable branch
        if: steps.changesets.outputs.hasChangesets == 'false' && github.ref_name == 'main' && endsWith(steps.version.outputs.version, '.0')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          MINOR=${VERSION%.0}
          BRANCH="stable/$MINOR"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Created branch $BRANCH"

      - name: Create GitHub release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh release create does not support the REST API's make_latest=legacy option.
          RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f make_latest=legacy >/dev/null
            echo "Release $TAG already exists; ensured make_latest=legacy"
            exit 0
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -F generate_release_notes=true \
            -f make_latest=legacy >/dev/null
          echo "Created release $TAG"

  # Manual/Cron release job - runs on schedule or manual trigger with tag
  manual-cron-release:
    name: Manual & Cron Release
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        with:
          fetch-depth: 0
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: 24.12.0
      - *npm-oidc-diagnostics
      - name: Release
        if: ${{ !inputs.diagnostics_only }}
        run: pnpm release ${{ github.event.inputs.tag || 'nightly' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true
          SHOPIFY_CLI_BUILD_REPO: ${{ github.repository }}
