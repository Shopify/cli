name: E2E orphan sweep

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: shopify-cli-e2e-orphan-sweep
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEBUG: '1'
  SHOPIFY_CLI_ENV: development
  SHOPIFY_CONFIG: debug
  PNPM_VERSION: '10.11.1'
  BUNDLE_WITHOUT: 'test:development'
  GH_TOKEN: ${{ secrets.SHOPIFY_GH_READ_CONTENT_TOKEN }}
  GH_TOKEN_SHOP: ${{ secrets.SHOP_GH_READ_CONTENT_TOKEN }}
  PLAYWRIGHT_NODE_VERSION: '24.1.0'
  ORPHAN_MINIMUM_AGE_HOURS: '24'

jobs:
  sweep:
    name: 'Remove abandoned E2E resources'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup deps
        uses: ./.github/actions/setup-cli-deps
        with:
          node-version: ${{ env.PLAYWRIGHT_NODE_VERSION }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
        working-directory: packages/e2e
      - name: Build CLI for cleanup auth
        run: pnpm nx run cli:build
      - name: Prime cleanup auth state
        continue-on-error: true
        env:
          E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_LOADTEST_HEADER: ${{ secrets.E2E_LOADTEST_HEADER }}
        run: pnpm --filter e2e exec tsx scripts/prime-browser-auth.ts
      - name: Remove abandoned E2E apps
        continue-on-error: true
        env:
          E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_LOADTEST_HEADER: ${{ secrets.E2E_LOADTEST_HEADER }}
        run: pnpm --filter e2e exec tsx scripts/cleanup-apps.ts --older-than-hours "${ORPHAN_MINIMUM_AGE_HOURS}"
      - name: Remove abandoned E2E stores
        continue-on-error: true
        env:
          E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_LOADTEST_HEADER: ${{ secrets.E2E_LOADTEST_HEADER }}
        run: pnpm --filter e2e exec tsx scripts/cleanup-stores.ts --older-than-hours "${ORPHAN_MINIMUM_AGE_HOURS}"
      - name: Verify abandoned E2E resources were removed
        if: ${{ always() }}
        env:
          E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_LOADTEST_HEADER: ${{ secrets.E2E_LOADTEST_HEADER }}
        run: |
          FAILED=0
          pnpm --filter e2e exec tsx scripts/cleanup-apps.ts --list --fail-if-found --older-than-hours "${ORPHAN_MINIMUM_AGE_HOURS}" || FAILED=1
          pnpm --filter e2e exec tsx scripts/cleanup-stores.ts --list --fail-if-found --older-than-hours "${ORPHAN_MINIMUM_AGE_HOURS}" || FAILED=1
          exit "${FAILED}"
